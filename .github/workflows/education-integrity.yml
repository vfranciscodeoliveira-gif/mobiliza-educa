name: Cadastros - integridade
on:
  pull_request:
    paths:
      - 'js/core/educationRepository.js'
      - 'js/modules/admin.js'
      - 'tests/educationRecordMismatch.test.mjs'
      - '.github/workflows/education-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'js/core/educationRepository.js'
      - 'js/modules/admin.js'
      - 'tests/educationRecordMismatch.test.mjs'
      - '.github/workflows/education-integrity.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/core/educationRepository.js
      - run: node --check js/modules/admin.js
      - run: node --test tests/educationRecordMismatch.test.mjs
