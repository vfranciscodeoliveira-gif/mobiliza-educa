name: Diagnóstico imports da Gestão
on:
  pull_request:
    paths:
      - 'js/adminImportDiagnosis.js'
      - 'diagnostico-gestao.html'
      - 'tests/adminImportDiagnosis.test.mjs'
      - '.github/workflows/admin-import-diagnosis.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/adminImportDiagnosis.js
      - run: node --test tests/adminImportDiagnosis.test.mjs
