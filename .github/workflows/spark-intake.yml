name: Atendimento gratuito - verificacoes
on:
  pull_request:
    paths:
      - 'js/directFirestore.js'
      - 'js/modules/publicService.js'
      - 'firestore.rules'
      - 'tests/sparkIntake.test.cjs'
      - '.github/workflows/spark-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sparkIntake.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Firebase CLI no runner
        run: npm install --global firebase-tools
      - name: Validar compilação real das regras Firestore no emulador
        run: firebase emulators:exec --project demo-mobiliza-educa --only firestore 'node --version'
