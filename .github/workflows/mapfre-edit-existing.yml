name: MAPFRE - editar reserva existente
on:
  pull_request:
    paths:
      - 'js/core/mapfreSchedule.js'
      - 'tests/mapfreEditConfirmed.test.mjs'
      - '.github/workflows/mapfre-edit-existing.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/core/mapfreSchedule.js
      - run: node --test tests/mapfreEditConfirmed.test.mjs
