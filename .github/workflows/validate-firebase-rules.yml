name: Firebase - validar regras sem publicar
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/lorenaFirestore.emulator.test.cjs'
      - '.github/workflows/validate-firebase-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools
      - name: Instalar SDKs de teste
        run: npm install --no-save --package-lock=false firebase@11.10.0 @firebase/rules-unit-testing@4.0.1
      - name: Testes especificos do convite
        run: node --test tests/lorenaInvite.test.cjs
      - name: Testar autorizacoes reais do Firestore no emulador
        run: firebase emulators:exec --project demo-mobiliza-educa --only firestore 'node --test tests/lorenaFirestore.emulator.test.cjs'
