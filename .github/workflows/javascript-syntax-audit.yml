name: Auditoria JavaScript completa
on:
  pull_request:
    paths:
      - '.github/workflows/javascript-syntax-audit.yml'
      - 'js/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe de todos os módulos
        shell: bash
        run: |
          set +e
          failed=0
          while IFS= read -r -d '' file; do
            output=$(node --check "$file" 2>&1)
            if [ $? -ne 0 ]; then
              echo "::error file=$file::Erro de sintaxe JavaScript"
              printf '%s\n' "$output"
              failed=$((failed+1))
            fi
          done < <(find js -type f -name '*.js' -print0)
          echo "Arquivos com erro: $failed"
          test "$failed" -eq 0
