name: Firestore - projeto em agendamentos
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/appointmentProjectRules.test.mjs'
      - '.github/workflows/appointment-project-rules.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/appointmentProjectRules.test.mjs
