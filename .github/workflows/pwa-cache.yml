name: PWA - atualização
on:
  pull_request:
    paths:
      - 'service-worker.js'
      - 'js/app.js'
      - 'index.html'
      - 'tests/pwaCache.test.mjs'
      - '.github/workflows/pwa-cache.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check service-worker.js
      - run: node --check js/app.js
      - run: node --test tests/pwaCache.test.mjs
