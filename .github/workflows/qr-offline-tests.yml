name: QR Educação Offline - testes
on:
  pull_request:
    paths:
      - 'qr-educacao/offline/**'
      - 'tests/qrOffline.test.mjs'
      - '.github/workflows/qr-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qr-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar servidor offline e kit de blitz
        run: node --test tests/qrOffline.test.mjs
