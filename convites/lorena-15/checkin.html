<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in — Lorena 15 anos</title><style>*{box-sizing:border-box}body{margin:0;background:#170e29;color:#fff1fb;font:16px system-ui,Segoe UI,sans-serif}main{max-width:540px;padding:22px;margin:40px auto;background:#302040;border:1px solid #c4a0c5;border-radius:20px}h1{font:normal 32px Georgia;color:#ffdb9d}input{padding:12px;border-radius:8px;width:100%;background:#120d1b;color:white;border:1px solid #b694bb;font:inherit}label{display:block;margin:12px 0}button{padding:12px 16px;background:#9558a5;color:white;border:1px solid #d9badb;border-radius:10px;margin-top:10px;cursor:pointer}#session[hidden],#result[hidden]{display:none}a{color:#ffdb9d}.status{background:#203540;padding:15px;border-radius:10px;margin-top:15px;white-space:pre-wrap}</style></head><body><main><h1>💜 Check-in Lorena 15 anos</h1><p>Esta página é exclusiva para o administrador. O QR Code não permite consultar dados particulares sem autenticação.</p><p><a href="./rsvp.html">← Central RSVP</a></p><section id="login"><label>E-mail<input id="email" type="email" autocomplete="username"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label><button id="signin">Entrar</button></section><section id="session" hidden><label>Código individual<input id="codigo" autocomplete="off" placeholder="Código do QR Code"></label><button id="find">Conferir código</button><div id="result" hidden><h2 id="family"></h2><p id="details"></p><button id="enter">Registrar entrada</button></div></section><p id="status" class="status" role="status">Faça login para validar o convite.</p></main>
<script type="module">
import{initializeApp,getApps,getApp}from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword}from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getFirestore,doc,getDoc,updateDoc,serverTimestamp}from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import{cloudConfig}from '../../js/cloudConfig.js?v=3';
const app=getApps().length?getApp():initializeApp(cloudConfig.firebaseWebConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let owner=false,guest=null;
$('codigo').value=new URL(location.href).searchParams.get('codigo')||'';
function msg(t){$('status').textContent=t}
$('signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch{msg('Login não autorizado.')}};
onAuthStateChanged(auth,async user=>{owner=false;$('session').hidden=true;$('login').hidden=!user;$('result').hidden=true;guest=null;if(!user)return;try{let d=await getDoc(doc(db,'platformOwners',user.uid));if(!d.exists()||d.data().active!==true)throw Error('Esta conta não possui autorização para check-in.');owner=true;$('login').hidden=true;$('session').hidden=false;msg('Autorizado. Confira o código individual antes da entrada.');if($('codigo').value)$('find').click()}catch(e){$('login').hidden=false;msg(e.message)}});
$('find').onclick=async()=>{if(!owner)return;const id=$('codigo').value.trim();guest=null;$('result').hidden=true;if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))return msg('Código inválido. Confira o QR individual.');try{const snapshot=await getDoc(doc(db,'inviteGuestFamilies',id));if(!snapshot.exists())return msg('Código não localizado na lista.');guest={id,...snapshot.data()};$('family').textContent=guest.nome;$('details').textContent='Situação: '+guest.resposta+' • '+guest.quantidade+' pessoa(s) • Entrada: '+(guest.checkedIn?'já registrada':'não registrada');$('enter').disabled=guest.checkedIn===true||guest.resposta!=='confirmado';$('enter').textContent=guest.checkedIn?'Entrada já registrada':guest.resposta!=='confirmado'?'Confirmação pendente':'Confirmar entrada';$('result').hidden=false;msg('Registro encontrado. Confira os dados antes de confirmar.')}catch(e){msg('Erro na consulta: '+e.message)}};
$('enter').onclick=async()=>{if(!owner||!guest||guest.checkedIn||guest.resposta!=='confirmado'||!confirm('Registrar entrada de '+guest.nome+'?'))return;try{await updateDoc(doc(db,'inviteGuestFamilies',guest.id),{checkedIn:true,checkedAt:serverTimestamp(),updatedAt:serverTimestamp(),updatedBy:auth.currentUser.uid});$('enter').disabled=true;$('enter').textContent='Entrada registrada';msg('✅ Check-in realizado com sucesso.')}catch(e){msg('Falha ao registrar entrada: '+e.message)}};
</script></body></html>
